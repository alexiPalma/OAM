name: Verified battle patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("ATTACK_CD=timedelta(minutes=10)","ATTACK_CD=timedelta(minutes=15)",1)
          s=s.replace("КД: 10 минут.","КД: 15 минут.",1)
          s=s.replace("Атаки имеют КД 10 минут.","Атаки имеют КД 15 минут.",1)
          s=s.replace("players=[r for r in allrows if not cd_seconds(r) and army_size(r)>0 and r['user_id'] not in INVITES.values()]","players=[r for r in allrows if army_size(r)>0 and r['user_id'] not in INVITES.values()]",1)
          s=s.replace("n='@'+p['username'] if p['username'] else f'ID {p[\"user_id\"]}';rows.append([(f'⚔️ {n} · {army_size(p)} ед.',f'opp:{p[\"user_id\"]}')])","n='@'+p['username'] if p['username'] else f'ID {p[\"user_id\"]}';status='✅ ГОТОВ' if cd_seconds(p)<=0 else f'⏳ КД {cd_text(p)}';rows.append([(f'⚔️ {n} · {army_size(p)} ед. · {status}',f'opp:{p[\"user_id\"]}')])",1)
          s=s.replace("me=await user(m.from_user.id);opp=await user(target)\n    if cd_seconds(me) or army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')","me=await user(m.from_user.id);opp=await user(target)\n    if cd_seconds(me):return await m.answer(f'❌ Ваш бой ещё на КД: {cd_text(me)}')\n    if army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')\n    if cd_seconds(opp):return await m.answer(f'❌ Игрок сейчас на КД: {cd_text(opp)}')",1)
          s=s.replace("uid=PENDING.pop(c.from_user.id,None)","uid=PENDING.get(c.from_user.id,None)",1)
          old="if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)\n    me=await user(c.from_user.id);opp=await user(uid)\n    if not opp or cd_seconds(me) or cd_seconds(opp) or army_size(opp)<=0:return await c.answer('Бой сейчас недоступен.',show_alert=True)\n    INVITES[c.from_user.id]=uid;"
          new="if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)\n    me=await user(c.from_user.id);opp=await user(uid)\n    if not opp or army_size(opp)<=0:\n        PENDING.pop(c.from_user.id,None);return await c.answer('Бой сейчас недоступен.',show_alert=True)\n    if cd_seconds(me):return await c.answer(f'Ваш бой ещё на КД: {cd_text(me)}.',show_alert=True)\n    if cd_seconds(opp):return await c.answer(f'Противник ещё на КД: {cd_text(opp)}.',show_alert=True)\n    PENDING.pop(c.from_user.id,None)\n    INVITES[c.from_user.id]=uid;"
          if old not in s: raise SystemExit('battle_confirm pattern missing')
          s=s.replace(old,new,1)
          s=s.replace("if not me or not opp or cd_seconds(me):return await c.answer('Бой уже недоступен.',show_alert=True)","if not me or not opp or cd_seconds(me) or cd_seconds(opp):return await c.answer('Бой уже недоступен.',show_alert=True)",1)
          s=s.replace("winner_k=kills_a if winner=='attacker' else kills_d;reward=","winner_k=kills_a if winner=='attacker' else kills_d;loser_k=kills_d if winner=='attacker' else kills_a;reward=",1)
          s=s.replace("await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[winner_k[k] for k in UNITS]+[winner_id]);","await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[winner_k[k] for k in UNITS]+[winner_id]);await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[loser_k[k] for k in UNITS]+[loser_id]);",1)
          old="wn=await user(winner_id);winner_name='@'+wn['username'] if wn['username'] else f'ID {winner_id}';kills_w='\\n'.join(f'{UNITS[k][\"title\"]}: {winner_k[k]}' for k in UNITS);loser_k=kills_d if winner=='attacker' else kills_a;kills_l='\\n'.join(f'{UNITS[k][\"title\"]}: {loser_k[k]}' for k in UNITS);wintext=await tpl('win',f'🏆 WIN\\n\\nПобедитель: {winner_name}\\n💰 Награда: ${money(reward)}\\n\\n🎯 Уничтожено:\\n{kills_w}',winner=winner_name,reward=money(reward),kills=kills_w);losstext=f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}\\n\\n🎯 Уничтожено:\\n{kils_l}';await bot.send_message(winner_id,wintext,reply_markup=back());await bot.send_message(loser_id,losstext,reply_markup=back())"
          old2="wn=await user(winner_id);winner_name='@'+wn['username'] if wn['username'] else f'ID {winner_id}';kills_w='\\n'.join(f'{UNITS[k][\"title\"]}: {winner_k[k]}' for k in UNITS);loser_k=kills_d if winner=='attacker' else kills_a;kills_l='\\n'.join(f'{UNITS[k][\"title\"]}: {loser_k[k]}' for k in UNITS);wintext=await tpl('win',f'🏆 WIN\\n\\nПобедитель: {winner_name}\\n💰 Награда: ${money(reward)}\\n\\n🎯 Уничтожено:\\n{kills_w}',winner=winner_name,reward=money(reward),kills=kills_w);losstext=f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}\\n\\n🎯 Уничтожено:\\n{kills_l}';await bot.send_message(winner_id,wintext,reply_markup=back());await bot.send_message(loser_id,losstext,reply_markup=back())"
          new="wn=await user(winner_id);winner_name='@'+wn['username'] if wn['username'] else f'ID {winner_id}';kills_w='\\n'.join(f'{UNITS[k][\"title\"]}: {winner_k[k]}' for k in UNITS);kills_l='\\n'.join(f'{UNITS[k][\"title\"]}: {loser_k[k]}' for k in UNITS);wintext=f'🏆 WIN\\n\\nПобедитель: {winner_name}\\n💰 Награда: ${money(reward)}\\n\\n🎯 Уничтожено:\\n{kills_w}';losstext=f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}\\n\\n🎯 Уничтожено:\\n{kills_l}';await bot.send_message(winner_id,wintext,reply_markup=back());await bot.send_message(loser_id,losstext,reply_markup=back())"
          if old2 not in s: raise SystemExit('battle result line not found')
          s=s.replace(old2,new,1)
          a=s.index('async def profile(c):');b=s.index('async def army(c):',a)
          profile="""async def profile(c):\n    u=await user(c.from_user.id);n='@'+u['username'] if u['username'] else 'не указан';kills='\\n'.join(f'{a}: {int(u[b])}' for a,b in [('🪖 Пехота','kill_soldier'),('🎯 Перехватчики','kill_interceptor'),('🛩 БПЛА','kill_drone'),('🚙 БМП','kill_bmp'),('🛡 Танки','kill_tank'),('🚁 Вертолёты','kill_helicopter'),('✈️ Самолёты','kill_plane'),('🚀 Ракеты','kill_missile'),('💥 Артиллерия','kill_artillery')]);t=await tpl('profile',f'👤 {BRAND} • ПРОФИЛЬ\\n\\n👤 Юзер: {n}\\n💵 Капитал: ${money(u[\"balance\"])}\\n🏭 Ферма: {u[\"farm_level\"]}/10\\n🏆 Побед: {u[\"attacks_won\"]}\\n💀 Поражений: {u[\"attacks_lost\"]}\\n⚔️ КД атаки: {cd_text(u)}\\n\\n🎯 УНИЧТОЖЕНО\\n{kills}',username=n,balance=money(u['balance']),farm=u['farm_level'],wins=u['attacks_won'],losses=u['attacks_lost'],battle_cd=cd_text(u),kills=kills);await safe(c,t,back())\n"""
          s=s[:a]+profile+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'Apply final battle system fixes'
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: |
          rm -f .github/workflows/final_apply2.yml FINAL_APPLY_TRIGGER.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove verified battle patch workflow' || true
          git push origin HEAD:main || true
