name: Temporary shop fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Restore artillery in shop')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore artillery in shop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("for k,v in UNITS.items() if k!='artillery'", "for k,v in UNITS.items()")
          s = s.replace("if k not in UNITS or k=='artillery':return await c.answer('Недоступно',show_alert=True)", "if k not in UNITS:return await c.answer('Недоступно',show_alert=True)")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'Restore artillery in shop'
          git push
