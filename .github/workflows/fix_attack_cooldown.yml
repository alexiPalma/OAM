name: Fix attack cooldown
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix attack cooldown target check')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot.py
        shell: python
        run: |
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          old="if cd_seconds(opp) or army_size(opp)<=0:"
          new="if army_size(opp)<=0:"
          if old not in s: raise SystemExit('target availability check not found')
          s=s.replace(old,new,1)
          old="if not me or not opp or cd_seconds(me) or cd_seconds(opp):"
          new="if not me or not opp or cd_seconds(me):"
          if old not in s: raise SystemExit('battle accept cooldown check not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet && exit 1
          git commit -m 'Fix attack cooldown target check'
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/fix_attack_cooldown.yml
          git add .github/workflows/fix_attack_cooldown.yml
          git commit -m 'Remove temporary attack cooldown fix workflow'
          git push origin HEAD:main
