name: Fix attack target filter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix attack target filter')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          old = "players=[r for r in allrows if not cd_seconds(r) and army_size(r)>0 and r['user_id'] not in INVITES.values()]"
          new = "players=[r for r in allrows if army_size(r)>0 and r['user_id'] not in INVITES.values()]"
          if old not in s:
              raise SystemExit('attack player filter not found')
          s = s.replace(old, new, 1)
          old = "if cd_seconds(me) or cd_seconds(opp) or army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')"
          new = "if cd_seconds(me) or army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet && exit 1
          git commit -m 'Fix attack target filter'
          git push origin HEAD:main
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/fix_attack_targets.yml
          git add .github/workflows/fix_attack_targets.yml
          git commit -m 'Remove temporary attack target fix workflow'
          git push origin HEAD:main
