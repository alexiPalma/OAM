name: Fix battle results again

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix battle results again')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch battle results
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          old = "'loss':('Поражение','{winner}; {loss}; {reward}'),"
          new = "'loss':('Поражение','{winner}; {loss}; {reward}; {kills}'),"
          if old not in s:
              raise SystemExit('loss EDIT_FIELDS entry not found')
          s = s.replace(old, new, 1)

          old = "kills='\\n'.join(f'{UNITS[k][\"title\"]}: {winner_k[k]}' for k in UNITS if winner_k[k]);wintext=await tpl('win',f'🏆 WIN\\n\\nПобедитель: {winner_name}\\n💰 Награда: ${money(reward)}\\n\\n🎯 Уничтожено:\\n{kills or \"—\"}',winner=winner_name,reward=money(reward),kills=kills);losstext=await tpl('loss',f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}',winner=winner_name,loss='20%',reward=money(loser_reward));"
          new = "kills_w='\\n'.join(f'{UNITS[k][\"title\"]}: {winner_k[k]}' for k in UNITS);loser_k=kills_d if winner=='attacker' else kills_a;kills_l='\\n'.join(f'{UNITS[k][\"title\"]}: {loser_k[k]}' for k in UNITS);wintext=await tpl('win',f'🏆 WIN\\n\\nПобедитель: {winner_name}\\n💰 Награда: ${money(reward)}\\n\\n🎯 Уничтожено:\\n{kills_w}',winner=winner_name,reward=money(reward),kills=kills_w);losstext=await tpl('loss',f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}\\n\\n🎯 Уничтожено:\\n{kills_l}',winner=winner_name,loss='20%',reward=money(loser_reward),kills=kills_l);"
          if old not in s:
              raise SystemExit('battle result rendering block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py .github/workflows/fix_battle_results_again.yml
          git rm .github/workflows/fix_battle_results_again.yml
          git diff --cached --quiet && exit 1
          git commit -m 'Fix battle results again'
          git push origin HEAD:main
