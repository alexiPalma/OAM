name: Final battle system fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Apply final battle system fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace("ATTACK_CD=timedelta(minutes=10)", "ATTACK_CD=timedelta(minutes=15)", 1)
          s = s.replace("КД: 10 минут.", "КД: 15 минут.", 1)
          s = s.replace("Атаки имеют КД 10 минут.", "Атаки имеют КД 15 минут.", 1)

          old = "players=[r for r in allrows if army_size(r)>0 and r['user_id'] not in INVITES.values()]"
          new = "players=[r for r in allrows if army_size(r)>0 and r['user_id'] not in INVITES.values()]"
          if old not in s:
              raise SystemExit('attack players block not found')

          old = "n='@'+p['username'] if p['username'] else f'ID {p[\"user_id\"]}';rows.append([(f'⚔️ {n} · {army_size(p)} ед.',f'opp:{p[\"user_id\"]}')])"
          new = "n='@'+p['username'] if p['username'] else f'ID {p[\"user_id\"]}';status='✅ ГОТОВ' if cd_seconds(p)<=0 else f'⏳ КД {cd_text(p)}';rows.append([(f'⚔️ {n} · {army_size(p)} ед. · {status}',f'opp:{p[\"user_id\"]}')])"
          if old not in s:
              raise SystemExit('attack button label not found')
          s = s.replace(old, new, 1)

          old = "    if not opp or uid==c.from_user.id:return await c.answer('Игрок недоступен.',show_alert=True)\n    if cd_seconds(me):return await c.answer('Ваш бой ещё на КД.',show_alert=True)\n    if army_size(opp)<=0:return await c.answer('Этот игрок сейчас недоступен.',show_alert=True)\n    PENDING[c.from_user.id]=uid;n='@'+opp['username'] if opp['username'] else f'ID {uid}';await safe(c,await tpl('opponent',f'🎯 {BRAND} • ПРОТИВНИК\\n\\n👤 {n}\\n\\n{army_text(opp)}',username=n,army=army_text(opp)),kb([[('⚔️ НАПАСТЬ','battle_confirm')],[('⬅️ Назад','attack')]]))"
          new = "    if not opp or uid==c.from_user.id:return await c.answer('Игрок недоступен.',show_alert=True)\n    if cd_seconds(me):return await c.answer('Ваш бой ещё на КД.',show_alert=True)\n    if army_size(opp)<=0:return await c.answer('Этот игрок сейчас недоступен.',show_alert=True)\n    PENDING[c.from_user.id]=uid;n='@'+opp['username'] if opp['username'] else f'ID {uid}';status='✅ К атаке доступен' if cd_seconds(opp)<=0 else f'⏳ Противник на КД: {cd_text(opp)}';markup=kb([[('⚔️ НАПАСТЬ','battle_confirm')]] if cd_seconds(opp)<=0 else [] + [[('⬅️ Назад','attack')]]);await safe(c,await tpl('opponent',f'🎯 {BRAND} • ПРОТИВНИК\\n\\n👤 {n}\\n\\n{army_text(opp)}\\n\\n{status}',username=n,army=army_text(opp)),markup)"
          if old not in s:
              raise SystemExit('opponent block not found')
          s = s.replace(old, new, 1)

          old = "async def battle_confirm(c,bot):\n    uid=PENDING.pop(c.from_user.id,None)\n    if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)\n    me=await user(c.from_user.id);opp=await user(uid)\n    if not opp or cd_seconds(me) or cd_seconds(opp) or army_size(opp)<=0:return await c.answer('Бой сейчас недоступен.',show_alert=True)\n    INVITES[c.from_user.id]=uid;"
          new = "async def battle_confirm(c,bot):\n    uid=PENDING.get(c.from_user.id)\n    if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)\n    me=await user(c.from_user.id);opp=await user(uid)\n    if not opp or army_size(opp)<=0:\n        PENDING.pop(c.from_user.id,None)\n        return await c.answer('Бой сейчас недоступен.',show_alert=True)\n    if cd_seconds(me):\n        return await c.answer('Ваш бой ещё на КД.',show_alert=True)\n    if cd_seconds(opp):\n        return await c.answer(f'Противник на КД: {cd_text(opp)}.',show_alert=True)\n    PENDING.pop(c.from_user.id,None)\n    INVITES[c.from_user.id]=uid;"
          if old not in s:
              raise SystemExit('battle_confirm block not found')
          s = s.replace(old, new, 1)

          old = "    me=await user(m.from_user.id);opp=await user(target)\n    if cd_seconds(me) or army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')"
          new = "    me=await user(m.from_user.id);opp=await user(target)\n    if cd_seconds(me):return await m.answer(f'❌ Ваш бой ещё на КД: {cd_text(me)}')\n    if army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')\n    if cd_seconds(opp):return await m.answer(f'❌ Игрок сейчас на КД: {cd_text(opp)}')"
          if old not in s:
              raise SystemExit('attack_by_username block not found')
          s = s.replace(old, new, 1)

          old = "await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[winner_k[k] for k in UNITS]+[winner_id]);"
          new = "await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[winner_k[k] for k in UNITS]+[winner_id]);await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[loser_k[k] for k in UNITS]+[loser_id]);"
          if old not in s:
              raise SystemExit('kill stats update not found')
          s = s.replace(old, new, 1)

          old = "    u=await user(c.from_user.id);n='@'+u['username'] if u['username'] else 'не указан';kills='\\n'.join(f'{a}: {int(u[b])}' for a,b in [('🪖 Пехота','kill_soldier'),('🎯 Перехватчики','kill_interceptor'),('🛩 БПЛА','kill_drone'),('🚙 БМП','kill_bmp'),('🛡 Танки','kill_tank'),('🚁 Вертолёты','kill_helicopter'),('✈️ Самолёты','kill_plane'),('🚀 Ракеты','kill_missile'),('💥 Артиллерия','kill_artillery')]);t=await tpl('profile',f'👤 {BRAND} • ПРОФИЛЬ\\n\\n👤 Юзер: {n}\\n💵 Капитал: ${money(u[\"balance\"])}\\n🏭 Ферма: {u[\"farm_level\"]}/10\\n🏆 Побед: {u[\"attacks_won\"]}\\n💀 Поражений: {u[\"attacks_lost\"]}\\n⚔️ КД атаки: {cd_text(u)}\\n\\n🎯 УНИЧТОЖЕНО\\n{kills}',username=n,balance=money(u['balance']),farm=u['farm_level'],wins=u['attacks_won'],losses=u['attacks_lost'],battle_cd=cd_text(u),kills=kills);await safe(c,t,back())"
          new = "    u=await user(c.from_user.id);n='@'+u['username'] if u['username'] else 'не указан';kills='\\n'.join(f'{a}: {int(u[b])}' for a,b in [('🪖 Пехота','kill_soldier'),('🎯 Перехватчики','kill_interceptor'),('🛩 БПЛА','kill_drone'),('🚙 БМП','kill_bmp'),('🛡 Танки','kill_tank'),('🚁 Вертолёты','kill_helicopter'),('✈️ Самолёты','kill_plane'),('🚀 Ракеты','kill_missile'),('💥 Артиллерия','kill_artillery')]);t=f'👤 {BRAND} • ПРОФИЛЬ\\n\\n👤 Юзер: {n}\\n💵 Капитал: ${money(u[\"balance\"])}\\n🏭 Ферма: {u[\"farm_level\"]}/10\\n🏆 Побед: {u[\"attacks_won\"]}\\n💀 Поражений: {u[\"attacks_lost\"]}\\n\\n🎯 УНИЧТОЖЕНО\\n{kills}';await safe(c,t,back())"
          if old not in s:
              raise SystemExit('profile block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'Apply final battle system fixes'
          git push origin HEAD:main
      - name: Remove workflow
        if: always()
        run: |
          rm .github/workflows/fix_battle_system_final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix_battle_system_final.yml
          git commit -m 'Remove final battle fix workflow' || true
          git push origin HEAD:main || true
