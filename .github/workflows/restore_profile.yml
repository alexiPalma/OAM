name: Restore profile
on:
  push:
    paths:
      - '.github/workflows/restore_profile.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore profile from original commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('bot.py')
          cur=p.read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','734b4d27ab144712a0b5b53ab02c043dc5fdbef3:bot.py'], text=True, encoding='utf-8')
          def block(s,name,next_name):
              a=s.index(f'async def {name}(')
              b=s.index(f'async def {next_name}(',a)
              return s[a:b]
          cur=cur[:cur.index('async def profile(')] + block(base,'profile','army') + cur[cur.index('async def army('):]
          cur_edit=re.search(r"'profile':\([^\n]+\),",cur)
          base_edit=re.search(r"'profile':\([^\n]+\),",base)
          if cur_edit and base_edit:
              cur=cur[:cur_edit.start()]+base_edit.group(0)+cur[cur_edit.end():]
          p.write_text(cur,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet && exit 1
          git commit -m 'Restore original profile'
          git push origin HEAD:main
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/restore_profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/restore_profile.yml
          git commit -m 'Remove temporary profile restore workflow' || true
          git push origin HEAD:main || true
