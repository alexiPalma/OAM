name: Final verified attack fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Final verified attack fix applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')

          # Never hide an opponent just because a stale pending invite exists.
          s=s.replace("players=[r for r in allrows if army_size(r)>0 and r['user_id'] not in INVITES.values()]", "players=[r for r in allrows if army_size(r)>0]", 1)

          # Prevent duplicate outgoing invites from creating inconsistent PENDING/INVITES state.
          old="async def battle_confirm(c,bot):\n    uid=PENDING.get(c.from_user.id,None)\n    if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)"
          new="async def battle_confirm(c,bot):\n    uid=PENDING.get(c.from_user.id,None)\n    if c.from_user.id in INVITES:return await c.answer('⏳ У вас уже есть ожидающий запрос на бой.',show_alert=True)\n    if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)"
          if old not in s: raise SystemExit('battle_confirm header not found')
          s=s.replace(old,new,1)

          # If the invite becomes invalid before acceptance, clear it so the target never gets stuck.
          old="async def battle_accept(c,attacker_id,bot):\n    attacker_id=int(attacker_id);defender_id=c.from_user.id\n    if INVITES.get(attacker_id)!=defender_id:return await c.answer('Приглашение уже недействительно.',show_alert=True)\n    me=await user(attacker_id);opp=await user(defender_id)\n    if not me or not opp or cd_seconds(me) or cd_seconds(opp):return await c.answer('Бой уже недоступен.',show_alert=True)\n    INVITES.pop(attacker_id,None)"
          new="async def battle_accept(c,attacker_id,bot):\n    attacker_id=int(attacker_id);defender_id=c.from_user.id\n    if INVITES.get(attacker_id)!=defender_id:return await c.answer('Приглашение уже недействительно.',show_alert=True)\n    me=await user(attacker_id);opp=await user(defender_id)\n    if not me or not opp or cd_seconds(me) or cd_seconds(opp):\n        INVITES.pop(attacker_id,None)\n        return await c.answer('Бой уже недоступен.',show_alert=True)\n    INVITES.pop(attacker_id,None)"
          if old not in s: raise SystemExit('battle_accept block not found')
          s=s.replace(old,new,1)

          # Show target CD in the opponent screen as well.
          old="PENDING[c.from_user.id]=uid;n='@'+opp['username'] if opp['username'] else f'ID {uid}';await safe(c,await tpl('opponent',f'🎯 {BRAND} • ПРОТИВНИК\\n\\n👤 {n}\\n\\n{army_text(opp)}',username=n,army=army_text(opp)),kb([[('⚔️ НАПАСТЬ','battle_confirm')],[('⬅️ Назад','attack')]]))"
          new="PENDING[c.from_user.id]=uid;n='@'+opp['username'] if opp['username'] else f'ID {uid}';status='✅ К атаке доступен' if cd_seconds(opp)<=0 else f'⏳ Противник на КД: {cd_text(opp)}';await safe(c,await tpl('opponent',f'🎯 {BRAND} • ПРОТИВНИК\\n\\n👤 {n}\\n\\n{army_text(opp)}\\n\\n{status}',username=n,army=army_text(opp)),kb([[('⚔️ НАПАСТЬ','battle_confirm')],[('⬅️ Назад','attack')]]))"
          if old not in s: raise SystemExit('opponent block not found')
          s=s.replace(old,new,1)

          # Make attack animation visible to the attacker too.
          old="await c.message.edit_text('⚔️ БОЙ НАЧИНАЕТСЯ...')\n    for i in range(15):\n        line=random.choice(BATTLE_LINES)\n        try:await c.message.edit_text(f'⚔️ {BRAND} • БОЙ\\n\\n{line}\\n\\n⏱ {15-i} сек.')\n        except Exception:pass\n        await asyncio.sleep(1)"
          new="await c.message.edit_text('⚔️ БОЙ НАЧИНАЕТСЯ...')\n    try: attacker_animation=await bot.send_message(attacker_id,f'⚔️ {BRAND} • БОЙ\\n\\nБой начинается...')\n    except Exception: attacker_animation=None\n    for i in range(15):\n        line=random.choice(BATTLE_LINES)\n        text=f'⚔️ {BRAND} • БОЙ\\n\\n{line}\\n\\n⏱ {15-i} сек.'\n        try:await c.message.edit_text(text)\n        except Exception:pass\n        if attacker_animation:\n            try:await bot.edit_message_text(chat_id=attacker_id,message_id=attacker_animation.message_id,text=text)\n            except Exception:pass\n        await asyncio.sleep(1)\n    if attacker_animation:\n        try:await bot.edit_message_text(chat_id=attacker_id,message_id=attacker_animation.message_id,text='✅ Бой завершён. Ниже — результат.')\n        except Exception:pass"
          if old not in s: raise SystemExit('battle animation block not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'Final verified attack fix'
          git push origin HEAD:main
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/final_verified_attack_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add -A
          git commit -m 'Remove final verified attack fix workflow' || true
          git push origin HEAD:main || true
