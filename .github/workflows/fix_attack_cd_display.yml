name: Fix attack CD display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Apply final battle system fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final battle system fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')

          # Attack cooldown is 15 minutes.
          s=s.replace("ATTACK_CD=timedelta(minutes=10)", "ATTACK_CD=timedelta(minutes=15)", 1)
          s=s.replace("КД: 10 минут.", "КД: 15 минут.", 1)
          s=s.replace("Атаки имеют КД 10 минут.", "Атаки имеют КД 15 минут.", 1)

          # Restore the original profile presentation from the working version.
          start=s.index('async def profile(c):')
          end=s.index('async def army(c):', start)
          profile="""async def profile(c):
              u=await user(c.from_user.id);n='@'+u['username'] if u['username'] else 'не указан';kills='\\n'.join(f'{a}: {int(u[b])}' for a,b in [('🪖 Пехота','kill_soldier'),('🎯 Перехватчики','kill_interceptor'),('🛩 БПЛА','kill_drone'),('🚙 БМП','kill_bmp'),('🛡 Танки','kill_tank'),('🚁 Вертолёты','kill_helicopter'),('✈️ Самолёты','kill_plane'),('🚀 Ракеты','kill_missile'),('💥 Артиллерия','kill_artillery')]);t=await tpl('profile',f'👤 {BRAND} • ПРОФИЛЬ\\n\\n👤 Юзер: {n}\\n💵 Капитал: ${money(u[\"balance\"])}\\n🏭 Ферма: {u[\"farm_level\"]}/10\\n🏆 Побед: {u[\"attacks_won\"]}\\n💀 Поражений: {u[\"attacks_lost\"]}\\n⚔️ КД атаки: {cd_text(u)}\\n\\n🎯 УНИЧТОЖЕНО\\n{kills}',username=n,balance=money(u['balance']),farm=u['farm_level'],wins=u['attacks_won'],losses=u['attacks_lost'],battle_cd=cd_text(u),kills=kills);await safe(c,t,back())
"""
          s=s[:start]+profile+s[end:]

          # Opponents remain visible. Their CD is shown in the list.
          s=s.replace("players=[r for r in allrows if not cd_seconds(r) and army_size(r)>0 and r['user_id'] not in INVITES.values()]", "players=[r for r in allrows if army_size(r)>0 and r['user_id'] not in INVITES.values()]", 1)
          s=s.replace("n='@'+p['username'] if p['username'] else f'ID {p[\"user_id\"]}';rows.append([(f'⚔️ {n} · {army_size(p)} ед.',f'opp:{p[\"user_id\"]}')])", "n='@'+p['username'] if p['username'] else f'ID {p[\"user_id\"]}';status='✅ ГОТОВ' if cd_seconds(p)<=0 else f'⏳ КД {cd_text(p)}';rows.append([(f'⚔️ {n} · {army_size(p)} ед. · {status}',f'opp:{p[\"user_id\"]}')])", 1)

          # Target CD is displayed and blocks attack, but does not hide the player.
          old="if not opp or uid==c.from_user.id:return await c.answer('Игрок недоступен.',show_alert=True)\\n    if cd_seconds(me):return await c.answer('Ваш бой ещё на КД.',show_alert=True)\\n    if army_size(opp)<=0:return await c.answer('Этот игрок сейчас недоступен.',show_alert=True)\\n    PENDING[c.from_user.id]=uid;n='@'+opp['username'] if opp['username'] else f'ID {uid}';await safe(c,await tpl('opponent',f'🎯 {BRAND} • ПРОТИВНИК\\n\\n👤 {n}\\n\\n{army_text(opp)}',username=n,army=army_text(opp)),kb([[('⚔️ НАПАСТЬ','battle_confirm')],[('⬅️ Назад','attack')]]))"
          new="if not opp or uid==c.from_user.id:return await c.answer('Игрок недоступен.',show_alert=True)\\n    if cd_seconds(me):return await c.answer('Ваш бой ещё на КД.',show_alert=True)\\n    if army_size(opp)<=0:return await c.answer('Этот игрок сейчас недоступен.',show_alert=True)\\n    PENDING[c.from_user.id]=uid;n='@'+opp['username'] if opp['username'] else f'ID {uid}';status='✅ К атаке доступен' if cd_seconds(opp)<=0 else f'⏳ Противник на КД: {cd_text(opp)}';buttons=[[('⚔️ НАПАСТЬ','battle_confirm')]] if cd_seconds(opp)<=0 else [];buttons.append(('⬅️ Назад','attack'));await safe(c,await tpl('opponent',f'🎯 {BRAND} • ПРОТИВНИК\\n\\n👤 {n}\\n\\n{army_text(opp)}\\n\\n{status}',username=n,army=army_text(opp)),kb([buttons]))"
          if old not in s:
              raise SystemExit('opponent block not found')
          s=s.replace(old,new,1)

          # Do not consume PENDING until all checks pass. This fixes the one-click invalid attack issue.
          old="async def battle_confirm(c,bot):\\n    uid=PENDING.pop(c.from_user.id,None)\\n    if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)\\n    me=await user(c.from_user.id);opp=await user(uid)\\n    if not opp or cd_seconds(me) or cd_seconds(opp) or army_size(opp)<=0:return await c.answer('Бой сейчас недоступен.',show_alert=True)\\n    INVITES[c.from_user.id]=uid;"
          new="async def battle_confirm(c,bot):\\n    uid=PENDING.get(c.from_user.id)\\n    if not uid:return await c.answer('Сначала выберите противника.',show_alert=True)\\n    me=await user(c.from_user.id);opp=await user(uid)\\n    if not opp or army_size(opp)<=0:\\n        PENDING.pop(c.from_user.id,None)\\n        return await c.answer('Бой сейчас недоступен.',show_alert=True)\\n    if cd_seconds(me):return await c.answer(f'Ваш бой ещё на КД: {cd_text(me)}.',show_alert=True)\\n    if cd_seconds(opp):return await c.answer(f'Противник ещё на КД: {cd_text(opp)}.',show_alert=True)\\n    PENDING.pop(c.from_user.id,None)\\n    INVITES[c.from_user.id]=uid;"
          if old not in s:
              raise SystemExit('battle_confirm block not found')
          s=s.replace(old,new,1)

          # Direct username attacks obey the same target-CD rule.
          old="me=await user(m.from_user.id);opp=await user(target)\\n    if cd_seconds(me) or army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')"
          new="me=await user(m.from_user.id);opp=await user(target)\\n    if cd_seconds(me):return await m.answer(f'❌ Ваш бой ещё на КД: {cd_text(me)}')\\n    if army_size(opp)<=0:return await m.answer('❌ Игрок сейчас недоступен.')\\n    if cd_seconds(opp):return await m.answer(f'❌ Игрок сейчас на КД: {cd_text(opp)}')"
          if old not in s:
              raise SystemExit('attack_by_username block not found')
          s=s.replace(old,new,1)

          # The defender's CD is also rechecked when accepting a pending attack.
          s=s.replace("if not me or not opp or cd_seconds(me):return await c.answer('Бой уже недоступен.',show_alert=True)", "if not me or not opp or cd_seconds(me) or cd_seconds(opp):return await c.answer('Бой уже недоступен.',show_alert=True)", 1)

          # Record kills for both players, not only the winner.
          marker="winner_k=kills_a if winner=='attacker' else kills_d;reward="
          replacement="winner_k=kills_a if winner=='attacker' else kills_d;loser_k=kills_d if winner=='attacker' else kills_a;reward="
          if marker not in s:
              raise SystemExit('winner_k marker not found')
          s=s.replace(marker,replacement,1)
          marker="await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[winner_k[k] for k in UNITS]+[winner_id]);"
          replacement="await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[winner_k[k] for k in UNITS]+[winner_id]);await db.execute(f'UPDATE users SET {ksets} WHERE user_id=?',[loser_k[k] for k in UNITS]+[loser_id]);"
          if marker not in s:
              raise SystemExit('kill counter update not found')
          s=s.replace(marker,replacement,1)

          # Hard-code both result messages so stale msg_loss/msg_win settings cannot hide the full list.
          pat=re.compile(r"\\n    wn=await user\(winner_id\);winner_name=.*?await bot\.send_message\(loser_id,losstext,reply_markup=back\(\)\)",re.S)
          repl="""\n    wn=await user(winner_id);winner_name='@'+wn['username'] if wn['username'] else f'ID {winner_id}'\n    kills_w='\\n'.join(f'{UNITS[k][\"title\"]}: {winner_k[k]}' for k in UNITS)\n    kills_l='\\n'.join(f'{UNITS[k][\"title\"]}: {loser_k[k]}' for k in UNITS)\n    wintext=f'🏆 WIN\\n\\nПобедитель: {winner_name}\\n💰 Награда: ${money(reward)}\\n\\n🎯 Уничтожено:\\n{kills_w}'\n    losstext=f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}\\n\\n🎯 Уничтожено:\\n{kills_l}'\n    await bot.send_message(winner_id,wintext,reply_markup=back())\n    await bot.send_message(loser_id,losstext,reply_markup=back())"""
          s,n=pat.subn(repl,s,1)
          if n!=1:
              raise SystemExit('battle result block not found')

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'Apply final battle system fixes'
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: always()
        run: |
          rm .github/workflows/fix_attack_cd_display.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix_attack_cd_display.yml
          git commit -m 'Remove final battle fix workflow' || true
          git push origin HEAD:main || true
