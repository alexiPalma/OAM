name: Fix loss template
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loss rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          old="losstext=await tpl('loss',f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}\\n\\n🎯 Уничтожено:\\n{kills_l}',winner=winner_name,loss='20%',reward=money(loser_reward),kills=kills_l);"
          new="losstext=f'💀 LOSS\\n\\n🏆 Победитель: {winner_name}\\n📉 Твоя армия: −20%\\n💵 Компенсация: ${money(loser_reward)}\\n\\n🎯 Уничтожено:\\n{kills_l}';"
          if old not in s:
              raise SystemExit('loss render block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet && exit 1
          git commit -m 'Fix loss battle result display'
          git push origin HEAD:main
      - name: Remove workflow
        if: always()
        run: |
          git rm .github/workflows/fix_loss_template.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary loss fix workflow' || true
          git push origin HEAD:main || true
