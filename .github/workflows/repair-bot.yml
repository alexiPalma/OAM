name: Repair bot.py

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore bot.py from known-good revision
        run: |
          git checkout 155ebb9c6a44fa12cf59eb6c5fb33675e4b1e1b4 -- bot.py
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          old = "def admin_kb(): return kb([[('💰 Валюта','a_currency'),('🎁 Бонусы','a_bonus')],[('📦 Кейсы','a_cases'),('🎟 Промокоды','a_promos')],[('💰 Заработать','a_earn'),('💳 Донат','a_donate')],[('📕 Правила','a_rules'),('👥 Админы','a_admins')],[('🎖 Выдать / списать','a_give'),('📣 Рассылка','a_broadcast')],[('📊 Статистика','a_stats'),('✏️ Редактировать','a_edit')],[('🏭 Фермы','a_farms'),('⚔️ Бои','a_battles')],[('👑 Владелец 2','a_owner2')],[('⬅️ Назад','home')]])"
          new = "def admin_kb(): return kb([[('💰 Валюта','a_currency'),('🎁 Бонусы','a_bonus')],[('📦 Кейсы','a_cases'),('🎟 Промокоды','a_promos')],[('💰 Заработать','a_earn'),('💳 Донат','a_donate')],[('📕 Правила','a_rules'),('👥 Админы','a_admins')],[('🎖 Выдать','a_give'),('➖ Списать технику','a_takeunit')],[('📣 Рассылка','a_broadcast'),('📊 Статистика','a_stats')],[('✏️ Редактировать','a_edit'),('🏭 Фермы','a_farms')],[('⚔️ Бои','a_battles'),('👑 Владелец 2','a_owner2')],[('⬅️ Назад','home')]])"
          if old not in s:
              raise SystemExit('expected admin_kb definition was not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py
          git diff --cached --quiet || git commit -m "Restore bot.py and add admin technology deduction button"
          git push
